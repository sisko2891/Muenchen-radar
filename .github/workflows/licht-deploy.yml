name: Licht-Dienst veröffentlichen (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["licht/**", ".github/workflows/licht-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: licht-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACC_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICHT_PASS: ${{ secrets.LICHT_PASS }}
      HUE_CLIENT_ID: ${{ secrets.HUE_CLIENT_ID }}
      HUE_CLIENT_SECRET: ${{ secrets.HUE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secrets prüfen (ohne Inhalte)
        id: check
        run: |
          missing=""
          for n in LICHT_PASS HUE_CLIENT_ID HUE_CLIENT_SECRET; do [ -n "${!n}" ] || missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "Noch nicht eingerichtet, fehlt:$missing – Veröffentlichung übersprungen."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ ${#LICHT_PASS} -ge 10 ] || { echo "LICHT_PASS ist kürzer als 10 Zeichen"; exit 1; }
          echo "go=1" >> "$GITHUB_OUTPUT"
      - name: Dienst veröffentlichen
        if: steps.check.outputs.go == '1'
        id: deploy
        working-directory: licht
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACC_RAW" | tr -d '[:space:]')"
          npx -y wrangler@3.114.17 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://katzingers-licht\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "Keine Adresse gefunden"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for n in LICHT_PASS HUE_CLIENT_ID HUE_CLIENT_SECRET; do
            printf '%s' "${!n}" | npx -y wrangler@3.114.17 secret put "$n" > /dev/null
            echo "$n gesetzt"
          done
      - name: Adresse des Dienstes für die Seite speichern
        if: steps.check.outputs.go == '1'
        run: |
          echo "{\"url\":\"${{ steps.deploy.outputs.url }}\"}" > data/licht.json
          git config user.name "muenchen-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/licht.json
          if ! git diff --cached --quiet; then
            git commit -m "Licht-Dienst: Adresse aktualisiert"
            git pull --rebase -X theirs origin main || true
            git push || echo "Push übersprungen"
          fi
      - name: Seite neu veröffentlichen
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
