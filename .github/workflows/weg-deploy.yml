name: Arbeitsweg-Dienst veröffentlichen (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["weg/**", "werkzeug/**", ".github/workflows/weg-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Secrets prüfen (ohne Inhalte)
        id: check
        env:
          WEG_PASS: ${{ secrets.WEG_PASS }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          WEG_START: ${{ secrets.WEG_START }}
          WEG_ZIEL: ${{ secrets.WEG_ZIEL }}
        run: werkzeug/pruefen.sh WEG_PASS 10 TOMTOM_KEY WEG_START WEG_ZIEL
      - name: Werkzeug installieren (fest eingefrorene Versionen, ohne Installationsskripte)
        if: steps.check.outputs.go == '1'
        working-directory: werkzeug
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dienst veröffentlichen
        if: steps.check.outputs.go == '1'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEG_PASS: ${{ secrets.WEG_PASS }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          WEG_START: ${{ secrets.WEG_START }}
          WEG_ZIEL: ${{ secrets.WEG_ZIEL }}
        run: werkzeug/veroeffentlichen.sh weg katzingers-weg WEG_PASS TOMTOM_KEY WEG_START WEG_ZIEL
      - name: Adresse des Dienstes für die Seite speichern
        if: steps.check.outputs.go == '1'
        id: adresse
        run: |
          echo "{\"url\":\"${{ steps.deploy.outputs.url }}\"}" > data/weg.json
          git add data/weg.json
          git diff --cached --quiet || echo "neu=1" >> "$GITHUB_OUTPUT"
          werkzeug/git-speichern.sh "Arbeitsweg-Dienst: Adresse aktualisiert" || { echo "::error::Adresse konnte nicht gespeichert werden"; exit 1; }
      - name: Seite neu veröffentlichen
        if: steps.adresse.outputs.neu == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
